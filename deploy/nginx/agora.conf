# As deployed on the server (certbot added the 443 block and the redirect). Fresh install: start from the
# port-80 part, run deploy/nginx/cloudflare-realip.sh, then: sudo certbot --nginx -d <domain> --redirect
# Agora: the web app serves the site and forwards /api/v1 to the engine, so nginx has one upstream.
server {
    server_name agora.alphabot.org.uk;
    if ($from_cloudflare = 0) { return 444; }   # only through Cloudflare

    client_max_body_size 1m;

    location /api/v1/events/stream {          # Server-Sent Events: no buffering, long-lived
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # real visitor IP (see conf.d/cloudflare-realip.conf)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # real visitor IP (see conf.d/cloudflare-realip.conf)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agora.alphabot.org.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agora.alphabot.org.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = agora.alphabot.org.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name agora.alphabot.org.uk;
    if ($from_cloudflare = 0) { return 444; }   # only through Cloudflare
    return 404; # managed by Certbot


}