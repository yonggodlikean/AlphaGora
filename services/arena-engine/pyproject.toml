[project]
name = "arena-engine"
version = "0.1.0"
description = "Agora A-share paper-trading matching engine and referee API"
requires-python = ">=3.12"
dependencies = []          # the matching core is dependency-free on purpose

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "asyncpg>=0.30", "redis>=5.2", "pydantic>=2.9"]
nautilus = ["nautilus_trader>=1.231"]
dev = ["pytest>=8.3", "httpx>=0.27", "pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
