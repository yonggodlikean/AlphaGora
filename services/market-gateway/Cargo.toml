[package]
name = "market-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Polls A-share L1 5-level quotes via rustdx-complete (TDX protocol) and publishes Agora snapshots to Redis"

[dependencies]
anyhow = "1"
calamine = "0.38.0"
chrono = "0.4"
env_logger = "0.11"
flate2 = "1.1.11"
log = "0.4"
redis = "0.27"
rustdx-complete = "1.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
